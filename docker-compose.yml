version: '3.8'

# ============================================================
# TechBoard — Full Stack Docker Compose
#
# Starts all five services with one command:
#   docker-compose up --build
#
# Services:
#   mysql        — MySQL 8.0 database (auto-initialised from seed files)
#   backend      — Node.js / Express REST API (port 3000)
#   frontend     — nginx serving static HTML/CSS/JS (port 80)
#   admin        — PHP 8.2 / Apache admin panel (port 8080)
#   intelligence — Python / Flask intelligence engine (port 5001)
#
# Environment:
#   Copy .env.example to .env and fill in all values before running.
#   Never commit .env to git.
#
# Useful commands:
#   docker-compose up --build          → build images + start all services
#   docker-compose up -d               → start in detached mode (background)
#   docker-compose logs -f backend     → follow Node.js logs
#   docker-compose ps                  → see running containers and their ports
#   docker-compose down -v             → stop + remove containers AND volumes
#   docker-compose exec mysql mysql -u root -p techboard → MySQL shell
# ============================================================

services:

  # ============================================================
  # MySQL 8.0 — Primary Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: techboard-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      techboard
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}

    # Mount SQL files into the Docker entrypoint init directory.
    # MySQL runs all *.sql files in /docker-entrypoint-initdb.d/ on first startup,
    # in lexicographic order — hence the numeric prefixes.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_categories.sql:/docker-entrypoint-initdb.d/02_categories.sql:ro
      - ./database/seed_industries.sql:/docker-entrypoint-initdb.d/03_industries.sql:ro
      - ./database/seed_sample_data.sql:/docker-entrypoint-initdb.d/04_sample.sql:ro

    ports:
      - "3306:3306"

    # MySQL takes several seconds to be ready to accept connections after the
    # container starts.  healthcheck lets dependent services (backend, intelligence)
    # wait for MySQL to be fully initialised before they attempt to connect.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 30s

    restart: unless-stopped

  # ============================================================
  # Node.js Backend — REST API
  # ============================================================
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: techboard-backend

    environment:
      # Database — use Docker service name, not localhost
      DB_HOST:     mysql
      DB_PORT:     3306
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     techboard

      # Server
      PORT:     3000
      NODE_ENV: production

      # JWT — must match the secret used to sign tokens
      JWT_SECRET: ${JWT_SECRET}

      # Flask intelligence engine — use Docker service name
      FLASK_URL: http://intelligence:5001

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL healthcheck to pass

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 20s

    restart: unless-stopped

  # ============================================================
  # nginx — Frontend Static File Server + API Reverse Proxy
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: techboard-frontend

    volumes:
      # Mount the static frontend files as read-only
      - ./frontend:/usr/share/nginx/html:ro
      # Mount our custom nginx config — overrides the default vhost
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped

  # ============================================================
  # PHP 8.2 Apache — Admin Panel
  # ============================================================
  admin:
    image: php:8.2-apache
    container_name: techboard-admin

    volumes:
      # Mount admin PHP files as the Apache document root
      - ./admin:/var/www/html

    environment:
      # PHP reads these via getenv() in admin/includes/db.php
      DB_HOST:      mysql
      DB_PORT:      3306
      DB_USER:      ${DB_USER}
      DB_PASSWORD:  ${DB_PASSWORD}
      DB_NAME:      techboard
      ADMIN_SECRET: ${ADMIN_SECRET}
      # Node.js API URL for any PHP → Node calls
      API_URL:      http://backend:3000

    ports:
      - "8080:80"

    depends_on:
      mysql:
        condition: service_healthy

    # Install the PDO MySQL extension — required by admin/includes/db.php.
    # This runs once at build time; the ext-pdo_mysql is part of the base image.
    # We use a command override to enable it via docker-php-ext-install.
    command: >
      bash -c "
        docker-php-ext-install pdo pdo_mysql &&
        a2enmod rewrite &&
        apache2-foreground
      "

    restart: unless-stopped

  # ============================================================
  # Python Flask — Intelligence Engine (internal only)
  # ============================================================
  intelligence:
    build:
      context:    ./intelligence
      dockerfile: Dockerfile
    container_name: techboard-intelligence

    environment:
      # Database — same credentials as Node.js
      DB_HOST:     mysql
      DB_PORT:     3306
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     techboard

      FLASK_PORT:  5001
      FLASK_DEBUG: "false"

    ports:
      - "5001:5001"   # exposed for direct testing; not needed by the frontend

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/intelligence/health')"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 30s

    restart: unless-stopped

# ============================================================
# Named volumes — data persists between docker-compose down/up
# Use  docker-compose down -v  to wipe the database completely.
# ============================================================
volumes:
  mysql_data:
    driver: local
