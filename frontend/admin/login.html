<!DOCTYPE html>
<html lang="en" data-theme="dark">
<!--
  admin/login.html — TechBoard Admin Login Page
  Calls POST /api/auth/login (Node.js JWT endpoint).
  On success: redirects to the PHP admin panel at /admin/ (port 8080 in Docker).
  Semantic HTML5: <header>, <main>, <footer>
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechBoard Admin — sign in to manage tools, categories, and data imports.">
  <title>Admin Login — TechBoard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS — same stack as every other page -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    /* Scoped login-page styles — kept minimal to match the design system */
    body { min-height: 100vh; display: flex; flex-direction: column; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-lg);
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: var(--space-xl) var(--space-2xl);
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-card);
    }

    .login-logo {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .login-logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .login-logo-text .accent { color: var(--accent-primary); }

    .login-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
      text-align: center;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    /* Reuse components.css form styles where possible */
    .login-form .form-group { margin-bottom: var(--space-lg); }

    .login-form label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--space-xs);
    }

    .login-form input[type="email"],
    .login-form input[type="password"] {
      display: block;
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: var(--font-sans);
      transition: border-color var(--transition), box-shadow var(--transition);
      box-sizing: border-box;
    }

    .login-form input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 15%, transparent);
    }

    .login-form input::placeholder { color: var(--text-muted); }

    .login-btn {
      display: block;
      width: 100%;
      padding: var(--space-sm) var(--space-lg);
      background: var(--accent-primary);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      margin-top: var(--space-xl);
    }

    .login-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Alert message — shown on error or success */
    .login-alert {
      display: none;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      margin-bottom: var(--space-lg);
      line-height: 1.5;
    }

    .login-alert--error {
      background: color-mix(in srgb, #fc8181 10%, transparent);
      border: 1px solid color-mix(in srgb, #fc8181 30%, transparent);
      color: #fc8181;
    }

    .login-alert--success {
      background: color-mix(in srgb, var(--accent-primary) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent-primary) 30%, transparent);
      color: var(--accent-primary);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: var(--space-lg);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color var(--transition);
    }

    .back-link:hover { color: var(--text-primary); }
  </style>

  <!-- API URL — same as other pages -->
  <script>
    window.TECHBOARD_API_URL = 'http://localhost:3000';
  </script>

  <script src="../js/theme.js"></script>
</head>

<body>

  <!-- ============================================================
       SITE HEADER
       ============================================================ -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="../index.html" class="logo" aria-label="TechBoard — home">
        <img src="../assets/logo.svg"
             alt="TechBoard"
             class="logo-img"
             width="148" height="32"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <span class="logo-text" style="display:none">
          Tech<span class="accent">Board</span>
        </span>
      </a>

      <nav class="header-nav" aria-label="Primary navigation">
        <a href="../index.html"         class="nav-link">Dashboard</a>
        <a href="../stack-builder.html" class="nav-link">Stack Builder</a>
        <button class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Switch to light mode"
                title="Switch to light mode">
          <span id="themeToggleIcon" aria-hidden="true">☾</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ============================================================
       MAIN — centred login card
       ============================================================ -->
  <main id="main-content" role="main">

    <div class="login-card" role="region" aria-labelledby="loginHeading">

      <!-- Logo mark -->
      <div class="login-logo" aria-hidden="true">
        <span class="login-logo-text">Tech<span class="accent">Board</span></span>
      </div>

      <h1 class="login-title" id="loginHeading">Admin Sign In</h1>
      <p class="login-subtitle">Enter your credentials to access the admin panel.</p>

      <!-- Alert — shown on login error or success; hidden by default -->
      <div class="login-alert" id="loginAlert" role="alert" aria-live="assertive"></div>

      <!-- Login form — calls POST /api/auth/login via JavaScript -->
      <form class="login-form"
            id="loginForm"
            novalidate
            aria-label="Admin login form">

        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email"
                 id="loginEmail"
                 name="email"
                 autocomplete="email"
                 required
                 placeholder="admin@techboard.dev"
                 aria-required="true">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password"
                 id="loginPassword"
                 name="password"
                 autocomplete="current-password"
                 required
                 placeholder="••••••••"
                 aria-required="true">
        </div>

        <button class="login-btn" type="submit" id="loginBtn">
          Sign In
        </button>

      </form><!-- /#loginForm -->

      <a href="../index.html" class="back-link">← Back to Dashboard</a>

    </div><!-- /.login-card -->

  </main><!-- /#main-content -->

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <p class="footer-credits" style="font-size:0.82rem; color:var(--text-muted)">
        TechBoard Admin Panel — access is restricted to authorised users.
      </p>
    </div>
  </footer>

  <!-- ============================================================
       SCRIPTS
       jQuery is required for the AJAX call; api.js is not needed here
       because we call the auth endpoint directly.
       ============================================================ -->
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>

  <script>
    /**
     * Admin login form handler.
     *
     * Submits credentials to POST /api/auth/login.
     * On success: stores the JWT in sessionStorage then redirects to the
     *             PHP admin panel on port 8080.
     * On failure: shows the error message from the API response.
     *
     * Client-side validation runs before the API call to give immediate
     * feedback without a round trip.
     */
    (function ($) {
      'use strict';

      /* PHP admin panel URL — port 8080 in Docker, can be overridden */
      var ADMIN_PANEL_URL = (typeof window.TECHBOARD_ADMIN_URL !== 'undefined')
        ? window.TECHBOARD_ADMIN_URL
        : 'http://localhost:8080/';

      /* API base URL — read from the global set in the <script> block above */
      var API_URL = (typeof window.TECHBOARD_API_URL !== 'undefined')
        ? window.TECHBOARD_API_URL
        : 'http://localhost:3000';

      var $form  = $('#loginForm');
      var $btn   = $('#loginBtn');
      var $alert = $('#loginAlert');

      /**
       * showAlert(message, type) — displays the alert box above the form.
       *
       * @param {string} message — text to display
       * @param {string} type    — 'error' | 'success'
       */
      function showAlert(message, type) {
        $alert
          .removeClass('login-alert--error login-alert--success')
          .addClass('login-alert--' + (type || 'error'))
          .text(message)
          .show();
      }

      /**
       * hideAlert() — hides the alert box.
       */
      function hideAlert() {
        $alert.hide().text('');
      }

      /**
       * validateForm() — lightweight client-side validation.
       *
       * Returns true if both fields have values; false and shows an alert otherwise.
       * The browser's built-in constraint validation (required, type=email) is
       * supplemented here to provide consistent messaging.
       *
       * @returns {boolean}
       */
      function validateForm() {
        var email    = $.trim($('#loginEmail').val());
        var password = $.trim($('#loginPassword').val());

        if (!email) {
          showAlert('Please enter your email address.', 'error');
          $('#loginEmail').focus();
          return false;
        }

        /* Basic email format check — the server validates properly */
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showAlert('Please enter a valid email address.', 'error');
          $('#loginEmail').focus();
          return false;
        }

        if (!password) {
          showAlert('Please enter your password.', 'error');
          $('#loginPassword').focus();
          return false;
        }

        return true;
      }

      /**
       * Form submit handler — calls the API and handles the response.
       */
      $form.on('submit', function (e) {
        e.preventDefault();   /* prevent default HTML form submission */
        hideAlert();

        /* Client-side validation — bail early if invalid */
        if (!validateForm()) { return; }

        var email    = $.trim($('#loginEmail').val());
        var password = $('#loginPassword').val();

        /* Disable the submit button to prevent double-submission */
        $btn.prop('disabled', true).text('Signing in…');

        /* POST /api/auth/login — jQuery AJAX */
        $.ajax({
          url:         API_URL + '/api/auth/login',
          method:      'POST',
          contentType: 'application/json',
          dataType:    'json',
          data: JSON.stringify({ email: email, password: password }),
          success: function (response) {
            /* Store the JWT so the PHP panel can read it from sessionStorage */
            if (response.token) {
              sessionStorage.setItem('techboard_jwt', response.token);
            }

            /* Grant premium preview mode — category.js reads this to unlock gated features */
            localStorage.setItem('techboard_tier', 'premium');

            showAlert('Login successful — redirecting…', 'success');

            /* Short delay so the user sees the success message, then redirect */
            setTimeout(function () {
              window.location.href = ADMIN_PANEL_URL;
            }, 800);
          },
          error: function (xhr) {
            $btn.prop('disabled', false).text('Sign In');

            /* Extract the API error message if available */
            var msg = 'Login failed. Please check your credentials.';
            if (xhr.responseJSON && xhr.responseJSON.error) {
              msg = xhr.responseJSON.error;
            } else if (xhr.status === 0) {
              msg = 'Could not reach the API server. Is the backend running?';
            } else if (xhr.status === 429) {
              msg = 'Too many login attempts. Please wait a moment and try again.';
            }

            showAlert(msg, 'error');

            /* Clear the password field on failure — security best practice */
            $('#loginPassword').val('').focus();
          },
        });
      });

      /* Clear alert when user starts typing again */
      $form.on('input', hideAlert);

    }(jQuery));
  </script>

  <noscript>
    <p style="text-align:center;padding:2rem;color:#6B7FA3">
      The admin login page requires JavaScript. Please enable JS in your browser.
    </p>
  </noscript>

</body>
</html>
