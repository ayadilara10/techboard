<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" fill="none" role="img" aria-label="TechBoard">

  <!-- ============================================================
       CIRCUIT-BOARD BRACKET MARK
       Two L-shapes (top-left + bottom-left) in cyan form a frame.
       Filled terminal dots at the outer corners anchor the mark.
       Subtle internal tick marks add circuit-trace detail.
       ============================================================ -->

  <!-- Top L: horizontal bar across, then drop down -->
  <path d="M2 5 H17 V14"
        stroke="#2DD4D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom L: rise up, then horizontal bar across -->
  <path d="M17 22 V31 H2"
        stroke="#2DD4D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal dots at the outer corners of the bracket -->
  <circle cx="2"  cy="5"  r="2.2" fill="#2DD4D4"/>
  <circle cx="2"  cy="31" r="2.2" fill="#2DD4D4"/>

  <!-- Centre connection dot on the vertical spine -->
  <circle cx="17" cy="18" r="1.5" fill="#2DD4D4" opacity="0.65"/>

  <!-- Short circuit-trace ticks branching off the spine — adds depth -->
  <line x1="17" y1="10" x2="21" y2="10"
        stroke="#2DD4D4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="17" y1="26" x2="21" y2="26"
        stroke="#2DD4D4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- ============================================================
       WORDMARK
       "Tech" in near-white, "Board" in cyan.
       System-UI stack used so the SVG renders correctly as <img>
       without depending on an external font load.
       ============================================================ -->
  <text x="26" y="26"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.4"
        fill="#D1D9E6">Tech</text>

  <text x="70" y="26"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.4"
        fill="#2DD4D4">Board</text>

</svg>
