# frontend/nginx.conf — TechBoard nginx Configuration
#
# This config is mounted into the nginx:alpine container at
# /etc/nginx/conf.d/default.conf (overriding the default vhost).
#
# Responsibilities:
#   1. Serve the static HTML/CSS/JS frontend from /usr/share/nginx/html
#   2. Proxy /api/* and /feed.xml to the Node.js backend (port 3000)
#   3. Set correct Content-Type headers for XML endpoints
#   4. Enable gzip compression for text assets
#   5. Add cache-control headers for static assets

server {
    listen 80;
    server_name _;                 # accept requests to any hostname

    root  /usr/share/nginx/html;
    index index.html;

    # ---- Gzip compression ----
    # Reduces payload size for CSS, JS, HTML, and JSON responses.
    gzip            on;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json
                    application/xml text/xml;
    gzip_min_length 1000;

    # ---- API proxy ----
    # Forward all /api/* and XML-related paths to the Node.js backend.
    # The backend container is named "backend" in docker-compose and listens on 3000.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow larger request bodies for future file-upload endpoints
        client_max_body_size 10m;
    }

    # RSS feed and XML export are served by the Node.js backend at root paths
    location /feed.xml {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Content-Type "application/xml; charset=utf-8";
    }

    # ---- Static assets — aggressive cache (1 year) ----
    # Browser will cache JS/CSS/fonts until the filename changes (cache-busting
    # via query string or file hash is a responsibility of the build process).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- HTML — no-cache so stale pages aren't served ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- SPA fallback ----
    # Any path that isn't an existing file falls back to index.html.
    # This allows the category.html?slug= URL format to work even on a hard
    # refresh (though TechBoard uses query strings, not HTML5 History API paths,
    # so this is mostly a safety net).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- Custom 404 ----
    error_page 404 /index.html;

    # ---- Security headers ----
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
